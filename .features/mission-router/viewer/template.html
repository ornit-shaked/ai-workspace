<title>Lifecycle Graph Explorer</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="claude:viewport-fit-sides" content="cover">
<meta name="lifecycle-graph-hash" content="__HASH__">
<style>
/* Self-contained (no network): system fonts, data embedded below. Layout: controls → graph canvas (scrolls inside) beside step panel. */
:root{
  --bg:#f5f6f8; --surface:#ffffff; --fg:#1a2130; --muted:#5a6476; --line:#d8dde6; --soft:#edf0f4;
  --accent:#3046c9;
  --main:#3046c9; --main-bg:#e8ebfb; --sub:#0f7a74; --sub-bg:#e0f3f1;
  --script:#5a6476; --script-bg:#eceff3; --gate:#b0620c; --gate-bg:#fcefdc;
  --off:#9aa3b2; --off-bg:#f2f3f6; --band:#f0f2f7; --band-line:#dfe3ec;
  --sans:"Segoe UI",system-ui,-apple-system,"Helvetica Neue",Arial,sans-serif;
  --mono:ui-monospace,"Cascadia Mono",Consolas,"SF Mono",Menlo,monospace;
  color-scheme:light;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#11141b; --surface:#191e28; --fg:#e3e7ef; --muted:#9aa3b5; --line:#2b3341; --soft:#202634;
  --accent:#93a3ff; --main:#93a3ff; --main-bg:#1f2747; --sub:#6fd3ca; --sub-bg:#14302e;
  --script:#a8b0c0; --script-bg:#232a36; --gate:#f0b15c; --gate-bg:#3a2a14; --off:#6b7486; --off-bg:#1c212b;
  --band:#161b24; --band-line:#262e3b; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#11141b; --surface:#191e28; --fg:#e3e7ef; --muted:#9aa3b5; --line:#2b3341; --soft:#202634;
  --accent:#93a3ff; --main:#93a3ff; --main-bg:#1f2747; --sub:#6fd3ca; --sub-bg:#14302e;
  --script:#a8b0c0; --script-bg:#232a36; --gate:#f0b15c; --gate-bg:#3a2a14; --off:#6b7486; --off-bg:#1c212b;
  --band:#161b24; --band-line:#262e3b; color-scheme:dark}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--fg);font-family:var(--sans);font-size:15px;line-height:1.55;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:28px 64px}
.wrap{max-width:1240px;margin:0 auto;display:flex;flex-direction:column;gap:18px}
h1{font-size:clamp(1.7rem,4vw,2.3rem);margin:0;letter-spacing:-.02em;line-height:1.15}
h3{margin:0;font-size:1.1rem}
p{margin:0;max-width:74ch}
.eyebrow{font-family:var(--mono);font-size:.72rem;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.muted{color:var(--muted)}
.controls{display:flex;flex-wrap:wrap;gap:12px 24px;align-items:center}
.ctl-label{font-family:var(--mono);font-size:.7rem;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);margin-right:6px}
.seg{display:inline-flex;flex-wrap:wrap;border:1px solid var(--line);border-radius:8px;overflow:hidden;background:var(--surface)}
.seg button{font:inherit;font-size:.85rem;padding:6px 12px;border:0;border-right:1px solid var(--line);background:transparent;color:var(--fg);cursor:pointer}
.seg button:last-child{border-right:0}
.seg button[aria-pressed="true"]{background:var(--fg);color:var(--bg)}
.seg button:focus-visible{outline:2px solid var(--accent);outline-offset:-2px}
.legend{display:flex;flex-wrap:wrap;gap:8px 16px;font-size:.82rem;color:var(--muted)}
.lg{display:inline-flex;align-items:center;gap:6px}
.sw{width:18px;height:12px;border-radius:3px;display:inline-block;border:1.5px solid}
.sw.main{background:var(--main-bg);border-color:var(--main)}
.sw.sub{background:var(--sub-bg);border-color:var(--sub);border-style:dashed}
.sw.script{background:var(--script-bg);border-color:var(--script);border-radius:0}
.sw.gate{background:var(--gate-bg);border-color:var(--gate);transform:rotate(45deg);width:11px;height:11px}
.sw.off{background:var(--off-bg);border-color:var(--off);border-style:dotted}
.banner{font-size:.85rem;background:var(--surface);border:1px solid var(--line);border-left:3px solid var(--gate);border-radius:8px;padding:8px 12px}
.explorer{display:grid;grid-template-columns:minmax(0,1fr) 320px;gap:16px;align-items:start}
@media (max-width:900px){.explorer{grid-template-columns:1fr}}
.canvas{background:var(--surface);border:1px solid var(--line);border-radius:12px;overflow-x:auto;min-width:0}
.trackdesc{font-size:.9rem;color:var(--muted);padding:12px 16px 0}
svg text{font-family:var(--sans);fill:var(--fg)}
.n{cursor:pointer}.n:focus{outline:none}
.n .shape{stroke-width:1.5}
.n:focus-visible .shape,.n.sel .shape{stroke-width:3}
.n.main .shape{fill:var(--main-bg);stroke:var(--main)}
.n.sub .shape{fill:var(--sub-bg);stroke:var(--sub);stroke-dasharray:5 3}
.n.script .shape{fill:var(--script-bg);stroke:var(--script)}
.n.gate .shape{fill:var(--gate-bg);stroke:var(--gate)}
.n.off .shape{fill:var(--off-bg);stroke:var(--off);stroke-dasharray:2 3}
.n.off text{fill:var(--off)}
.n .ghost{fill:var(--sub-bg);stroke:var(--sub);stroke-width:1;opacity:.55}
.nt{font-size:12.5px;font-weight:600}
.nm{font-family:var(--mono);font-size:10px;fill:var(--muted)}
.nk{font-family:var(--mono);font-size:9.5px;fill:var(--muted)}
.edge{fill:none;stroke:var(--muted);stroke-width:1.3}
.loop{fill:none;stroke:var(--sub);stroke-width:1.3;stroke-dasharray:4 3}
.looptxt{font-family:var(--mono);font-size:9.5px;fill:var(--sub)}
.ah{fill:var(--muted)}.ahl{fill:var(--sub)}
.band{fill:var(--band);stroke:var(--band-line)}
.bandtxt{font-family:var(--mono);font-size:10.5px;fill:var(--muted);letter-spacing:.04em}
.bandend{font-family:var(--mono);font-size:10px;fill:var(--gate)}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:16px;display:flex;flex-direction:column;gap:12px;position:sticky;top:calc(env(safe-area-inset-top,0px) + 12px)}
@media (max-width:900px){.panel{position:static}}
.kv{display:grid;grid-template-columns:86px 1fr;gap:6px 10px;font-size:.86rem;margin:0}
.kv dt{font-family:var(--mono);font-size:.7rem;text-transform:uppercase;letter-spacing:.05em;color:var(--muted);padding-top:2px}
.kv dd{margin:0;min-width:0;overflow-wrap:anywhere}
.chip{display:inline-block;font-family:var(--mono);font-size:.74rem;padding:1px 7px;border-radius:999px;margin:1px 2px 1px 0}
.chip.main{background:var(--main-bg);color:var(--main)}.chip.sub{background:var(--sub-bg);color:var(--sub)}
.chip.script{background:var(--script-bg);color:var(--script)}.chip.gate{background:var(--gate-bg);color:var(--gate)}
.chip.off{background:var(--off-bg);color:var(--off)}
.why{font-size:.86rem;color:var(--muted);border-left:3px solid var(--line);padding-left:10px}
footer{font-size:.8rem;color:var(--muted)}
code{font-family:var(--mono);font-size:.85em;background:var(--soft);padding:1px 5px;border-radius:4px}
</style>

<div class="wrap">
  <div class="eyebrow" id="source">lifecycle · flow</div>
  <h1>Lifecycle Graph Explorer</h1>
  <p class="muted">The flow lifecycle runs, generated from its graph. Pick a track, switch what's installed, click a step.</p>
  <div class="banner" id="banner" hidden></div>
  <div class="controls">
    <div><span class="ctl-label">Track</span><span class="seg" id="trackSeg"></span></div>
    <div><span class="ctl-label">Installed</span><span class="seg" id="setSeg"></span></div>
  </div>
  <div class="legend">
    <span class="lg"><span class="sw main"></span>Main agent</span>
    <span class="lg"><span class="sw sub"></span>Sub-agent</span>
    <span class="lg"><span class="sw script"></span>Script (no LLM)</span>
    <span class="lg"><span class="sw gate"></span>Your gate</span>
    <span class="lg"><span class="sw off"></span>Off</span>
    <span class="lg">Stacked = parallel · dashed arc = capped loop · band = one session</span>
  </div>
  <div class="explorer">
    <div class="canvas"><div class="trackdesc" id="trackDesc"></div><div id="graph"></div></div>
    <aside class="panel" id="panel" aria-live="polite"></aside>
  </div>
  <footer id="foot"></footer>
</div>

<script type="application/json" id="graph-data">__GRAPH_JSON__</script>
<script type="application/json" id="graph-meta">__META_JSON__</script>
<script>
(function(){
const G=JSON.parse(document.getElementById("graph-data").textContent);
const META=JSON.parse(document.getElementById("graph-meta").textContent);
const MODE={main:"Main agent",sub:"Sub-agent",script:"Script",gate:"Your gate",off:"Off"};
const MODEL={opus:"Opus",sonnet:"Sonnet",haiku:"Haiku",session:"session",none:"no LLM",you:"you"};
const SETS=[["none","Neither",[]],["sp","Superpowers",["superpowers"]],["mp","Matt",["mattpocock"]],["both","Both",["superpowers","mattpocock"]]];
const ORDER=Object.keys(G.tracks);
let cur=ORDER.includes("feature")?"feature":ORDER[0], sel=null;
let set=META.detected?(META.detected.superpowers&&META.detected.mattpocock?"both":META.detected.superpowers?"sp":META.detected.mattpocock?"mp":"none"):"both";
try{const h=location.hash.slice(1); if(G.tracks[h]) cur=h;}catch(e){}
const esc=s=>String(s==null?"":s).replace(/&/g,"&amp;").replace(/</g,"&lt;");
const installed=()=>["lifecycle"].concat(SETS.find(s=>s[0]===set)[2]);
function resolveList(list){
  if(!list||!list.length) return {text:"—",reason:""};
  const inst=installed(), cond=[];
  for(const e of list){const use=typeof e==="string"?e:e.use, when=typeof e==="string"?null:e.when;
    if(!inst.includes(use.split(":")[0])) continue;
    if(when){cond.push(use+" if "+when); continue;}
    const fb=use.startsWith("lifecycle:")&&list.some(x=>{const u=typeof x==="string"?x:x.use;return !u.startsWith("lifecycle:")});
    return {text:cond.concat([use]).join(" · else "),reason:fb?"fallback: preferred skill set not installed":"installed"};}
  return {text:cond.join(" · ")||"—",reason:""};
}
function seg(el,items,get,setf){
  el.innerHTML=items.map(([k,l])=>`<button type="button" data-k="${k}" aria-pressed="${get()===k}">${esc(l)}</button>`).join("");
  el.onclick=e=>{const b=e.target.closest("button"); if(!b) return; setf(b.dataset.k); render();};
}
function wrapText(t,max){const w=t.split(" "),out=[];let l="";for(const x of w){if((l+" "+x).trim().length>max&&l){out.push(l);l=x}else l=(l+" "+x).trim()}if(l)out.push(l);return out.slice(0,3)}
function draw(){
  const tr=G.tracks[cur],W=158,H=82,GX=44,GY=64,PER=4,PADX=24,BP=34;
  let y=16,maxX=0;const pos={},parts=[],seqs=[];
  tr.sessions.forEach(s=>{
    const rows=Math.ceil(s.steps.length/PER),top=y,bh=BP+rows*H+(rows-1)*GY+28;
    const cols=Math.min(PER,s.steps.length),bw=PADX*2+cols*W+(cols-1)*GX;
    parts.push(`<rect class="band" x="8" y="${top}" width="${bw}" height="${bh}" rx="12"/><text class="bandtxt" x="22" y="${top+21}">${esc(s.label.toUpperCase())}</text>`+(s.endsAt?`<text class="bandend" x="${bw-10}" y="${top+bh-9}" text-anchor="end">ends at ${esc(s.endsAt)}</text>`:""));
    const seq=[];
    s.steps.forEach((st,i)=>{const r=Math.floor(i/PER),c=i%PER;pos[st.id]={x:8+PADX+c*(W+GX),y:top+BP+r*(H+GY)+12,st};seq.push(st.id);});
    seqs.push(seq);maxX=Math.max(maxX,8+bw);y=top+bh+22;
  });
  const chain=cur==="loop"?seqs:[seqs.flat()];
  const ed=[];
  chain.forEach(seq=>{for(let i=1;i<seq.length;i++){const a=pos[seq[i-1]],b=pos[seq[i]];
    if(Math.abs(a.y-b.y)<1) ed.push(`<path class="edge" d="M${a.x+W} ${a.y+H/2} H${b.x-6}" marker-end="url(#a)"/>`);
    else{const my=a.y+H+(b.y-a.y-H)/2;ed.push(`<path class="edge" d="M${a.x+W-24} ${a.y+H} V${my} H${b.x+W-24} V${b.y-6}" marker-end="url(#a)"/>`);}}});
  if(cur==="loop"&&pos.wrap&&pos.setup){const a=pos.wrap,b=pos.setup;ed.push(`<path class="edge" style="stroke-dasharray:3 3" d="M${a.x+W/2} ${a.y+H} v16 H${b.x+20} V${b.y+H+6}" marker-end="url(#a)"/><text class="nk" x="${b.x+28}" y="${a.y+H+28}">next session</text>`);}
  const lp=[];
  Object.values(pos).forEach(p=>{const st=p.st;if(!st.loop)return;const lbl=(st.loop.with==="self"?"retry":st.loop.with)+" ≤"+st.loop.max;
    const from=st.loop.after&&pos[st.loop.after]?pos[st.loop.after]:null;
    if(!from||Math.abs(from.y-p.y)>1){const x=p.x+W-26,yy=p.y;lp.push(`<path class="loop" d="M${x} ${yy} c 0 -26 34 -26 34 0" marker-end="url(#al)"/><text class="looptxt" x="${x-4}" y="${yy-24}" text-anchor="end">${esc(lbl)}</text>`);}
    else{const x1=from.x+W*0.3,x2=p.x+W*0.7,yy=p.y;lp.push(`<path class="loop" d="M${x1} ${yy} C ${x1} ${yy-36} ${x2} ${yy-36} ${x2} ${yy}" marker-end="url(#al)"/><text class="looptxt" x="${(x1+x2)/2}" y="${yy-31}" text-anchor="middle">${esc(lbl)}</text>`);}});
  const ns=Object.values(pos).map(p=>{const st=p.st,x=p.x,yy=p.y,g=st.mode==="gate";
    const shape=g?`<polygon class="shape" points="${x+W/2},${yy} ${x+W},${yy+H/2} ${x+W/2},${yy+H} ${x},${yy+H/2}"/>`:`<rect class="shape" x="${x}" y="${yy}" width="${W}" height="${H}" rx="${st.mode==="script"?2:10}"/>`;
    const ghost=st.parallel?`<rect class="ghost" x="${x+8}" y="${yy-8}" width="${W}" height="${H}" rx="10"/><rect class="ghost" x="${x+4}" y="${yy-4}" width="${W}" height="${H}" rx="10"/>`:"";
    const lines=wrapText(st.title,g?14:20),ty=g?yy+H/2-(lines.length-1)*7+4:yy+22;
    const txt=lines.map((l,i)=>`<text class="nt" x="${x+(g?W/2:12)}" y="${ty+i*15}" ${g?'text-anchor="middle"':""}>${esc(l)}</text>`).join("");
    const sk=st.mode==="script"?(st.run||"").split("/").pop():resolveList(st.skill).text;
    const meta=g?"":`<text class="nm" x="${x+12}" y="${yy+H-24}">${esc(MODE[st.mode])} · ${esc(MODEL[st.model]||st.model)}${st.background?" · bg":""}</text><text class="nk" x="${x+12}" y="${yy+H-10}">${esc(sk.length>26?sk.slice(0,25)+"…":sk)}</text>`;
    return `<g class="n ${st.mode}${sel===st.id?" sel":""}" data-id="${esc(st.id)}" tabindex="0" role="button" aria-label="${esc(st.title)}">${ghost}${shape}${txt}${meta}</g>`;}).join("");
  const w=Math.max(maxX+20,600);
  document.getElementById("graph").innerHTML=`<svg width="${w}" height="${y}" viewBox="0 0 ${w} ${y}" xmlns="http://www.w3.org/2000/svg"><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path class="ah" d="M0,0 L10,5 L0,10 z"/></marker><marker id="al" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path class="ahl" d="M0,0 L10,5 L0,10 z"/></marker></defs>${parts.join("")}${ed.join("")}${lp.join("")}${ns}</svg>`;
  document.getElementById("trackDesc").textContent=tr.when||"";
}
function panel(){
  const p=document.getElementById("panel"),tr=G.tracks[cur];
  const st=sel?tr.sessions.flatMap(s=>s.steps).find(s=>s.id===sel):null;
  if(!st){const all=tr.sessions.flatMap(s=>s.steps),c={};all.forEach(s=>c[s.mode]=(c[s.mode]||0)+1);
    p.innerHTML=`<div class="eyebrow">${esc(tr.title)}</div><h3>Click a step</h3><p class="muted" style="font-size:.88rem">${esc(tr.when)}</p><dl class="kv"><dt>Sessions</dt><dd>${tr.sessions.length}</dd><dt>Section</dt><dd>${tr.section?`<code>${esc(tr.section)}</code>`:"—"}</dd><dt>Steps</dt><dd>${Object.entries(c).map(([m,n])=>`<span class="chip ${m}">${n} ${esc(MODE[m])}</span>`).join("")}</dd></dl>`;return;}
  const r=resolveList(st.skill),t=resolveList(st.tddSkill);
  const row=(k,v)=>v?`<dt>${k}</dt><dd>${v}</dd>`:"";
  p.innerHTML=`<div class="eyebrow">${esc(tr.title)} · step</div><h3>${esc(st.title)}</h3>
  <div><span class="chip ${st.mode}">${esc(MODE[st.mode])}</span><span class="chip script">${esc(MODEL[st.model]||st.model)}</span>${st.modelOnRisk?`<span class="chip script">${esc(MODEL[st.modelOnRisk])} on risk</span>`:""}${st.parallel?`<span class="chip sub">parallel per ${esc(st.parallel)}</span>`:""}${st.background?'<span class="chip script">background</span>':""}</div>
  <p class="why">${esc(st.why)}</p>
  <dl class="kv">${row("Skill",st.skill?esc(r.text)+(r.reason?` <span class="muted">(${esc(r.reason)})</span>`:""):"")}${row("Agent",st.agent?`<code>${esc(st.agent)}</code>`:"")}${row("Script",st.run?`<code>${esc(st.run)}</code>`:"")}${row("TDD",st.tdd?esc(st.tdd)+(st.tdd!=="off"&&st.tddSkill?" → "+esc(t.text):""):"")}${row("Tests",st.test?esc(st.test)+(st.testOnHotFile?` (${esc(st.testOnHotFile)} if hot file)`:""):"")}${row("Loop",st.loop?`${esc(st.loop.with)} ≤${st.loop.max}`+(st.loop.after?` after ${esc(st.loop.after)}`:""):"")}${row("Gate",st.gate?esc(st.gate):"")}${row("Reads",esc((st.reads||[]).join(", ")))}${row("Writes",esc((st.writes||[]).join(", ")))}</dl>`;
}
function render(){
  seg(document.getElementById("trackSeg"),ORDER.map(k=>[k,G.tracks[k].title]),()=>cur,k=>{cur=k;sel=null;try{history.replaceState(null,"","#"+k)}catch(e){}});
  seg(document.getElementById("setSeg"),SETS.map(s=>[s[0],s[1]+(META.detected&&s[0]===set&&META.project?" (this project)":"")]),()=>set,k=>{set=k});
  draw();panel();
}
const g=document.getElementById("graph");
g.addEventListener("click",e=>{const n=e.target.closest(".n");if(!n)return;sel=n.dataset.id;draw();panel();});
g.addEventListener("keydown",e=>{if(e.key!=="Enter"&&e.key!==" ")return;const n=e.target.closest(".n");if(!n)return;e.preventDefault();sel=n.dataset.id;draw();panel();const f=document.querySelector(`.n[data-id="${CSS.escape(sel)}"]`);if(f)f.focus();});
document.getElementById("source").textContent="lifecycle · "+(META.source||"flow");
if(META.overrides&&META.overrides.length){const b=document.getElementById("banner");b.hidden=false;b.textContent="Project overrides in effect: "+META.overrides.join(" · ");}
document.getElementById("foot").innerHTML=`Generated ${esc(META.generated||"")} from <code>${esc(META.from||"graph.json")}</code>. Regenerate: <code>/lifecycle:graph</code>.`;
render();
})();
</script>
