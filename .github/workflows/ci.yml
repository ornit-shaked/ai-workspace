name: CI

on:
  pull_request:
  push:
    branches:
      - main
      - master

jobs:
  sync-shared-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - run: npm install
      - name: Verify vendored installer copies are in sync with plugins/_shared/installer.js
        run: npm run sync-shared:check
